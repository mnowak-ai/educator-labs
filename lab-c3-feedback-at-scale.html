<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab C3: Feedback at Scale | AI Essentials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#4A1478; --violet:#7B2FBE; --gold:#E9A23B; --green:#2E7D4F; --orange:#C2561B;
  --ink:#2B1B45; --muted:#6E6283; --line:#E6DDF2; --lav:#F7F3FC; --lav2:#EFE7F8;
  --white:#fff; --shadow:0 1px 0 rgba(74,20,120,.06), 0 8px 24px -12px rgba(74,20,120,.18);
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--serif);color:var(--purple);font-weight:500;line-height:1.15;margin:0 0 .4em}
h1{font-size:2.4rem;letter-spacing:-.01em}
h2{font-size:1.75rem}
h3{font-size:1.2rem}
p{margin:0 0 1em}
a{color:var(--violet)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
textarea,input[type=text]{font-family:inherit;font-size:1rem;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:.7rem .85rem;width:100%;background:#fff}
textarea{min-height:96px;resize:vertical;line-height:1.5}
textarea:focus,input:focus,button:focus-visible,.tap:focus-visible{outline:3px solid rgba(123,47,190,.35);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.01em;color:var(--muted)}
.sr{position:absolute;left:-9999px}

/* header */
.hdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1040px;margin:0 auto;padding:.6rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--violet);display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:15px;font-weight:600}
.brand-t{font-family:var(--serif);color:var(--purple);font-size:1.05rem;font-weight:500;line-height:1}
.brand-s{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:.4rem;margin-left:auto;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.74rem;padding:.3rem .6rem;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:#fff;display:inline-flex;gap:.4rem;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.c i{background:var(--green)} .chip.m i{background:var(--orange)} .chip.o i{background:var(--gold)}
.hbtn{background:#fff;border:1.5px solid var(--line);color:var(--purple);padding:.4rem .75rem;border-radius:999px;font-weight:500;font-size:.85rem;display:inline-flex;align-items:center;gap:.4rem}
.hbtn:hover{border-color:var(--violet)}
.dots{max-width:1040px;margin:0 auto;padding:.35rem 1.25rem .6rem;display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;color:var(--muted);font-family:var(--mono);font-size:.62rem;border:0;background:none;padding:.25rem .3rem;border-radius:8px}
.dot svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dot.done{color:var(--green)} .dot.cur{color:var(--purple);background:var(--lav)} .dot[disabled]{cursor:default}

/* stage */
main{max-width:1040px;margin:0 auto;padding:1.5rem 1.25rem 7rem}
.eyebrow{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-bottom:.6rem;display:flex;gap:.8rem;flex-wrap:wrap}
.eyebrow b{color:var(--violet);font-weight:500}
.lead{font-size:1.1rem;max-width:64ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem}
.card.lav{background:var(--lav);border-color:transparent}
.card h3{margin-top:0}
.syn{font-family:var(--mono);font-size:.68rem;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:.15rem .45rem;display:inline-block}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:.35rem 0 .35rem 1.4rem;position:relative}
ul.clean li::before{content:"";position:absolute;left:.2rem;top:.85rem;width:.55rem;height:.55rem;border-radius:2px;background:var(--gold)}
ul.clean.no li::before{background:var(--orange);border-radius:50%}

/* documents */
.doc{background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:1.2rem 1.4rem;box-shadow:var(--shadow);position:relative;font-size:.95rem}
.doc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--violet);border-radius:6px 0 0 6px}
.doc-h{font-family:var(--serif);color:var(--purple);font-size:1.15rem;margin:0 0 .15rem}
.doc-m{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-bottom:.9rem}
.doc table{border-collapse:collapse;width:100%;font-size:.92rem}
.doc td,.doc th{border:1px solid var(--line);padding:.4rem .6rem;text-align:left;vertical-align:top}
.doc th{background:var(--lav);font-weight:500;color:var(--purple)}
.doc .sec{font-family:var(--mono);color:var(--violet);font-size:.78rem}
.doctabs{display:flex;gap:.4rem;margin-bottom:.9rem;flex-wrap:wrap}
.doctab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.4rem .9rem;color:var(--purple);font-weight:500}
.doctab.on{background:var(--purple);color:#fff;border-color:var(--purple)}

/* paper stack */
.stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.paper{background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:.8rem .8rem .7rem;min-height:110px;text-align:left;position:relative;transition:transform .15s,border-color .15s;box-shadow:var(--shadow)}
.paper::after{content:"";position:absolute;right:0;top:0;border-width:0 14px 14px 0;border-style:solid;border-color:var(--lav2) #fff}
.paper:hover{transform:translateY(-2px);border-color:var(--violet)}
.paper.read{border-color:var(--gold)} .paper.on{border-color:var(--purple);box-shadow:0 0 0 3px var(--lav2)}
.paper .pid{font-family:var(--mono);font-size:.8rem;color:var(--purple)}
.paper .pl{margin-top:.5rem;display:flex;flex-direction:column;gap:5px}
.paper .pl i{display:block;height:3px;background:var(--lav2);border-radius:2px}
.paper .chk{position:absolute;left:.7rem;right:.5rem;bottom:.5rem;font-family:var(--mono);font-size:.64rem;color:var(--orange);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sample{background:var(--lav);border-radius:var(--r);padding:1.1rem 1.25rem;font-size:1rem;line-height:1.6}
.sample .pid{font-family:var(--mono);font-size:.78rem;color:var(--purple);margin-bottom:.4rem;display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.filenote{border-left:3px solid var(--gold);padding:.5rem .9rem;margin-top:.8rem;font-size:.92rem;background:#fff;border-radius:0 8px 8px 0}
.filenote b{color:var(--purple);font-weight:500}

/* choices */
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin:.4rem 0;color:var(--ink)}
.opt:hover{border-color:var(--violet)}
.opt.on{border-color:var(--purple);background:var(--lav)}
.opt.ok{border-color:var(--green);background:#EDF7F0}
.opt.bad{border-color:var(--orange);background:#FBF0E8}
.why{font-size:.92rem;color:var(--muted);padding:.4rem .2rem 0}
.q{margin-bottom:1.3rem}
.q h3{font-family:var(--sans);font-size:1rem;color:var(--ink);font-weight:500}

/* draft audit */
.line{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:.65rem .8rem;margin:.35rem 0;color:var(--ink);line-height:1.5;position:relative;transition:background .15s}
.line:hover{border-color:var(--violet)}
.line.tag{border-color:var(--violet);background:var(--lav)}
.line .tg{display:inline-block;font-family:var(--mono);font-size:.68rem;color:var(--violet);margin-top:.35rem}
.line.ok{border-color:var(--green);background:#EDF7F0} .line.miss{border-color:var(--orange);background:#FBF0E8} .line.over{border-color:var(--gold);background:#FDF6E7}
.line .rsn{display:block;font-size:.85rem;margin-top:.35rem;color:var(--muted)}
.skim .line:not(.expanded):not(:first-child){display:none}
.linewrap{margin:.35rem 0}
.linewrap .line{margin:0}
.line.open{border-color:var(--purple);border-bottom-left-radius:0;border-bottom-right-radius:0}
.tagrow{display:flex;flex-wrap:wrap;gap:.35rem;padding:.55rem .6rem .3rem;border:1.5px solid var(--purple);border-top:0;border-radius:0 0 10px 10px;background:var(--lav)}
.tagchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.35rem .7rem;font-size:.86rem;color:var(--purple);font-weight:500}
.tagchip:hover{border-color:var(--violet)}
.tagchip.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.tagclose{border:0;background:none;color:var(--muted);font-family:var(--mono);font-size:.76rem;text-decoration:underline;padding:.1rem .2rem;white-space:nowrap}
.tagclose:hover{color:var(--purple)}
.tagdesc{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;font-size:.82rem;color:var(--muted);padding:.2rem .7rem .55rem;border:1.5px solid var(--purple);border-top:0;border-radius:0 0 10px 10px;background:var(--lav);margin-top:-1px}
.tagrow + .tagdesc{border-radius:0 0 10px 10px}
.tagrow{border-radius:0}
.triage{display:flex;gap:.4rem;margin:.8rem 0 .4rem}
.tbtn{flex:1;background:var(--purple);color:#fff;border:1.5px solid var(--purple);border-radius:10px;padding:.6rem;font-weight:500}
.tbtn:hover{background:var(--violet);border-color:var(--violet)}
.checked{font-family:var(--mono);font-size:.76rem;color:var(--green);margin:.7rem 0 .5rem}
.badgebar{display:flex;gap:.6rem;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:.5rem;border:1.5px solid var(--line);border-radius:999px;padding:.35rem .8rem .35rem .4rem;font-size:.85rem;color:var(--muted)}
.badge svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badge.earned{color:var(--purple);border-color:var(--gold);background:#FDF6E7}

/* error log */
.elog{border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.elog table{width:100%;border-collapse:collapse;font-size:.9rem}
.elog th{background:var(--lav);color:var(--purple);font-weight:500;text-align:left;padding:.5rem .8rem}
.elog td{padding:.45rem .8rem;border-top:1px solid var(--line)}
.elog td.n{font-family:var(--mono);text-align:right;color:var(--purple)}
.rate{font-family:var(--serif);font-size:2.2rem;color:var(--purple);line-height:1}
.dnav{display:flex;gap:.3rem;flex-wrap:wrap;margin:.6rem 0 1rem}
.dnav button{font-family:var(--mono);font-size:.74rem;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:.3rem .5rem;color:var(--muted)}
.dnav button.cur{border-color:var(--purple);color:var(--purple)} .dnav button.done{border-color:var(--green);color:var(--green)}
.dnav button.skim{border-style:dashed}

/* sandbox */
.chat{border:1.5px solid var(--line);border-radius:var(--r);padding:1rem;min-height:120px;font-size:.95rem;white-space:pre-wrap;background:#fff}
.chat.loading{color:var(--muted)}
.frame{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:820px){.frame{grid-template-columns:1fr}}
.frame .fbox{border:1.5px solid var(--line);border-radius:12px;padding:.8rem}
.frame .fbox h4{font-family:var(--sans);font-size:.95rem;color:var(--purple);margin:0 0 .2rem;font-weight:600}
.frame .fbox h4 span{font-family:var(--mono);color:var(--gold);margin-right:.4rem}
.frame .fbox small{display:block;color:var(--muted);margin-bottom:.4rem;font-size:.82rem}
.assembled{background:var(--lav);border-radius:12px;padding:.9rem 1rem;font-family:var(--mono);font-size:.8rem;white-space:pre-wrap;line-height:1.5;max-height:260px;overflow:auto}

/* prompt audit */
.pdoc{font-size:.97rem;line-height:1.6}
.pseg{display:inline;font:inherit;color:inherit;background:none;border:0;padding:.1rem .2rem;margin:0 .1rem 0 0;border-radius:4px;text-align:left;cursor:pointer;line-height:inherit;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pseg:hover{background:var(--lav2)}
.pseg.on{background:#FBF0E8;box-shadow:inset 0 -2px 0 var(--orange)}
.pseg:disabled{cursor:default}
.pseg{position:relative}
.pflag{display:inline-block;font-family:var(--mono);font-size:.62rem;color:var(--orange);margin-left:.35rem;vertical-align:middle}
.prow{display:flex;justify-content:space-between;gap:.6rem;padding:.4rem 0;border-top:1px solid var(--line);font-size:.9rem}
.prow.todo .mono{color:var(--orange)}
.pop{position:fixed;z-index:55;width:360px;max-width:calc(100vw - 24px);background:#fff;border:1.5px solid var(--line);border-radius:14px;box-shadow:0 12px 40px -12px rgba(74,20,120,.35);padding:.9rem 1rem;max-height:80vh;overflow:auto}
.pop-h{font-family:var(--serif);color:var(--purple);font-size:1.05rem}
@media(max-width:720px){.pop{left:12px !important;right:12px;top:auto !important;bottom:5.4rem;width:auto;max-height:65vh}}
.opt.sm{padding:.45rem .7rem;font-size:.9rem;margin:.25rem 0}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin:1.2rem 0}
@media(max-width:820px){.wgrid{grid-template-columns:1fr}}
.wcard{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:1.1rem 1.2rem 1.2rem;color:var(--ink);transition:transform .15s,border-color .15s,opacity .2s,box-shadow .15s}
.wcard:hover{transform:translateY(-2px);border-color:var(--violet);box-shadow:var(--shadow)}
.wcard.act{border-color:var(--violet);box-shadow:0 0 0 3px var(--lav2)}
.wcard.on{border-color:var(--gold);border-width:2px;background:#FFFBF2;box-shadow:0 0 0 4px #FDF1D8}
.wcard.dim{opacity:.38;transform:none}
.wcard[disabled]{cursor:default}
.wid{font-family:var(--serif);color:var(--purple);font-size:1.45rem;line-height:1}
.wshort{font-size:.92rem;color:var(--muted);margin:.35rem 0 .8rem}
.wquote{position:relative;background:var(--lav);border-radius:12px;padding:.75rem .9rem .75rem 1.5rem;font-size:.95rem;line-height:1.5;color:var(--ink)}
.wquote::before{content:"\201C";position:absolute;left:.55rem;top:.15rem;font-family:var(--serif);font-size:1.9rem;color:var(--violet);opacity:.6;line-height:1}
.wbadge{position:absolute;top:-.6rem;right:1rem;background:var(--gold);color:#fff;font-family:var(--mono);font-size:.68rem;padding:.2rem .6rem;border-radius:999px}
.wread{border:1.5px solid var(--line);border-radius:18px;padding:1.2rem 1.3rem;background:#fff;margin-top:.4rem;box-shadow:var(--shadow)}
.wread-h{display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap;color:var(--purple);margin-bottom:.9rem;border-bottom:1px solid var(--line);padding-bottom:.7rem}
.wread-body{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:820px){.wread-body{grid-template-columns:1fr}}
.wpaper{background:var(--lav);border-radius:12px;padding:.9rem 1rem}
.wpaper p{margin:.3rem 0 0;font-size:.95rem;line-height:1.6}
.wcomment{padding:.9rem 1rem;border:1.5px solid var(--line);border-radius:12px}
.wcomment p{margin:.3rem 0 0;font-size:.95rem;line-height:1.6;padding:.3rem .5rem;border-radius:8px}
.wcomment p.hot{background:#FBF0E8;box-shadow:inset 3px 0 0 var(--orange)}
.wread-f{display:flex;align-items:center;gap:1rem;margin-top:1rem;flex-wrap:wrap}
.wafter{margin-top:1rem;background:#FFFBF2;border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:.9rem 1rem}
.wafter p{margin:0;font-size:1rem;line-height:1.6}
.wwhy{margin-top:1.2rem;background:var(--lav);border-radius:18px;padding:1.1rem 1.3rem}
.wwhy p{margin:0 0 .8rem;font-size:.97rem}
.wlessons{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.4rem}
@media(max-width:820px){.wlessons{grid-template-columns:1fr}}
.wlesson{position:relative;border-top:3px solid var(--gold);padding:1rem .2rem 0}
.wlesson .wnum{font-family:var(--serif);font-size:2.2rem;color:var(--gold);line-height:1;margin-bottom:.3rem}
.wlesson h3{font-size:1.25rem;margin:0 0 .4rem}
.wlesson p{margin:0;font-size:.95rem;color:var(--ink);line-height:1.6}
/* buttons */
.btn{background:var(--purple);color:#fff;border:0;border-radius:999px;padding:.7rem 1.3rem;font-weight:500;display:inline-flex;align-items:center;gap:.5rem}
.btn:hover{background:var(--violet)} .btn[disabled]{background:#C9BBD9;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--purple);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--violet);background:#fff}
.btn.sm{padding:.45rem .9rem;font-size:.9rem}
.btn.copied,.btn.ghost.copied{background:var(--green);color:#fff;border-color:var(--green)}
.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem}
@media(max-width:820px){.skillgrid{grid-template-columns:1fr}}
.skillcard{border:1.5px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;position:relative}
.skillcard.good{border-top:4px solid var(--green)}
.skillcard.open{border-top:4px solid var(--orange)}
.sk-mark{position:absolute;top:-14px;right:16px;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.skillcard.good .sk-mark{border-color:var(--green);color:var(--green)}
.skillcard.open .sk-mark{border-color:var(--orange);color:var(--orange)}
.skillcard h3{font-size:1.05rem;margin:.3rem 0 .4rem}
.skillcard p{font-size:.92rem;color:var(--ink);margin:0 0 .8rem}
.bnav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:35;backdrop-filter:blur(8px)}
.bnav-in{max-width:1040px;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;gap:.6rem}
.bnav .gate{flex:1;font-size:.88rem;color:var(--muted)}
.bnav .gate.no{color:var(--orange)}
.pv{font-family:var(--mono);font-size:.7rem;color:var(--gold);display:flex;gap:.3rem;align-items:center}
.pv button{border:1px dashed var(--gold);background:#fff;color:var(--gold);border-radius:6px;padding:.15rem .4rem;font-family:var(--mono);font-size:.7rem}
@media(max-width:640px){.bnav-in{flex-wrap:wrap}.bnav .gate{width:100%;order:-1}.btn.next{flex:1;justify-content:center}}

/* toast, modal */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.2rem;background:var(--purple);color:#fff;padding:.6rem 1rem;border-radius:999px;font-size:.9rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(43,27,69,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow:auto}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:860px;width:100%;padding:1.4rem 1.5rem 1.6rem;position:relative}
.mbox .x{position:absolute;right:.8rem;top:.8rem;border:0;background:var(--lav);width:34px;height:34px;border-radius:50%;color:var(--purple);font-size:1.1rem}
.refnav{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}

/* beaker */
.beaker-wrap{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.beaker-wrap svg{width:100%;max-width:340px;height:auto}
.fluidsel{display:flex;gap:.4rem;margin-top:.6rem}
.reveal{border:1.5px solid var(--line);border-left:4px solid var(--green);border-radius:0 12px 12px 0;padding:.9rem 1rem;margin:.8rem 0;background:#fff}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200); }
function log(ev, data) { S.transcript.push({ t: Math.round((Date.now() - S.startedAt) / 1000), step: STEPS[S.step].key, ev, data }); }
function words(s) { return (s || "").trim().split(/\s+/).filter(Boolean).length; }
function sid(i) { return SAMPLES[i].id; }

/* ---------- header ---------- */
function renderChrome() {
  $("#chips").innerHTML = `<span class="chip c"><i></i>catches ${S.score.c}</span><span class="chip m"><i></i>misses ${S.score.m}</span><span class="chip o"><i></i>over-corrections ${S.score.o}</span>`;
  $("#dots").innerHTML = STEPS.map((st, i) => `<button class="dot ${i < S.step ? "done" : ""} ${i === S.step ? "cur" : ""}" ${CONFIG.preview ? `onclick="jump(${i})"` : "disabled"} aria-label="${st.label}">${ICONS[st.icon]}<span>${st.label}</span></button>`).join("");
  $("#pv").innerHTML = CONFIG.preview ? `preview <button onclick="jump(S.step-1)">prev</button><button onclick="jump(S.step+1)">skip</button>` : "";
  $("#backBtn").style.visibility = S.step === 0 ? "hidden" : "visible";
  const last = S.step === STEPS.length - 1;
  $("#nextBtn").textContent = S.step === STEPS.length - 2 ? "Finish the Lab" : "Next";
  $("#nextBtn").classList.toggle("hidden", last);
}
function updateGate() {

function kitText(withPapers) {
  const papers = withPapers ? PRACTICE.map(i => `${SAMPLES[i].id}\n${SAMPLES[i].text}`).join("\n\n") : "[Paste your first de-identified paper here. Initials and a number only, e.g. J.M. 01]\n\n[Second paper]\n\n[Third paper]";
  return `${fixedPrompt()}\n\nASSIGNMENT\n${DOCS.assignment.prompt}\n\nSOURCE SHEET\n${sourceSheetText()}\n\nRUBRIC\n${rubricText()}\n\nPAPERS\n${papers}`;
}
function copyText(text, label, btn) {
  const done = () => { toast(label + " copied"); if (btn) { const old = btn.textContent; btn.textContent = "Copied"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 2500); } };
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.left = "-9999px"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) { } ta.remove(); if (ok) done(); else openModal(`<h3>Copy it by hand</h3><p style="font-size:.92rem;color:var(--muted)">This browser would not let the page copy for you. The text below is selected; press Ctrl+C or Cmd+C.</p><textarea id="manualcopy" style="min-height:320px;font-family:var(--mono);font-size:.8rem">${esc(text)}</textarea>`); setTimeout(() => { const m = $("#manualcopy"); if (m) { m.focus(); m.select(); } }, 50); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fallback); else fallback();
}
function copyKit(withPapers, btn) { copyText(kitText(withPapers), withPapers ? "Practice pack" : "Prompt kit", btn); }
function downloadKit(withPapers) { download(withPapers ? "c3-practice-pack.txt" : "c3-prompt-kit.txt", kitText(withPapers), "text/plain"); }
function copyFixed(btn) { copyText(fixedPrompt(), "Rebuilt prompt", btn); }

/* ---------- debrief ---------- */
function pickWorst(i) { if (S.worst != null) return; S.worst = i; log("worst", i); renderWorst(); }
function openWorst(i) { if (S.worst != null) return; S.wopen = i; renderWorst(); const p = $("#wread"); if (p) p.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
function renderWorst() {
  const el = $("#worstpane"); if (!el) return;
  const picked = S.worst, open = picked != null ? picked : S.wopen;
  const grid = `<div class="wgrid">${DEBRIEF.cards.map(c => {
    const on = picked === c.d, dim = picked != null && !on, act = open === c.d;
    return `<button class="wcard ${on ? "on" : ""} ${dim ? "dim" : ""} ${act && picked == null ? "act" : ""}" ${picked != null ? "disabled" : ""} onclick="openWorst(${c.d})">
      <div class="wid">${c.label}</div><div class="wshort">${esc(c.short)}</div>
      <div class="wquote">${esc(DRAFTS[c.d][c.line])}</div>
      ${on ? `<div class="wbadge">your pick</div>` : ""}</button>`;
  }).join("")}</div>`;
  let pane = "";
  if (open != null) {
    const c = DEBRIEF.cards.find(x => x.d === open);
    pane = `<div class="wread" id="wread">
      <div class="wread-h"><span class="wid">${c.label}</span><span>${esc(c.short)}</span></div>
      <div class="wread-body">
        <div class="wpaper"><div class="mono">what the student wrote</div><p>${esc(SAMPLES[c.d].text)}</p><div class="filenote" style="margin-top:.6rem"><b>Priya's note.</b> ${esc(SAMPLES[c.d].file)}</div></div>
        <div class="wcomment"><div class="mono">what the tool wrote back</div>${DRAFTS[c.d].map((ln, i) => `<p class="${i === c.line ? "hot" : ""}">${esc(ln)}</p>`).join("")}</div>
      </div>
      ${picked == null ? `<div class="wread-f"><button class="btn" onclick="pickWorst(${c.d})">This is the one</button><span class="mono">or open another card</span></div>` : `<div class="wafter"><p>${DEBRIEF.after[c.d]}</p></div>`}
    </div>`;
  }
  let tail = "";
  if (picked != null) tail = `
    <div class="wwhy"><p>${DEBRIEF.close}</p><label class="mono" for="wy">Why that one? One or two sentences.</label><textarea id="wy" oninput="S.worstWhy=this.value;updateGate()">${esc(S.worstWhy || "")}</textarea></div>
    <div class="wlessons">${DEBRIEF.lessons.map((l, i) => `<div class="wlesson"><div class="wnum">${i + 1}</div><h3>${l.h}</h3><p>${l.b}</p></div>`).join("")}</div>`;
  el.innerHTML = grid + pane + tail;
  updateGate();
}

/* ---------- skills summary ---------- */
function skillsData() {
  const p = S.pscore || { caught: [] };
  const promptN = p.caught.length;
  const koRight = S.calls[2] && !S.calls[2].send && S.whys[2] === 0;
  const tailCatches = [8, 9, 10].filter(i => S.calls[i] && !S.calls[i].send && verdict(i).why && S.whys[i] === verdict(i).why.a).length;
  const t = S.transfer;
  const usedTool = !!(t.tool && words(t.draft) >= 10);
  return [
    { title: "Wrote a prompt an AI cannot misread", step: 2,
      status: promptN >= 5 ? "You found " + promptN + " of the 7 problems in her prompt, including what happens if each one ships as written." : "You found " + promptN + " of the 7 problems in her prompt. The rest are worth a second look.",
      good: promptN >= 5 },
    { title: "Caught an AI hallucination", step: 4,
      status: koRight ? "You caught it: the comment on K.O. 03 asked for evidence that was already in the second sentence, for the right reason." : "This is the one to revisit: the comment on K.O. 03 asked for evidence that was already on the page, and it is worth going back to see why.",
      good: koRight },
    { title: "Spotted quality decay at the end of a batch", step: 4,
      status: tailCatches >= 2 ? "You caught " + tailCatches + " of the last three comments, where the tool starts copying its own earlier answers." : "You caught " + tailCatches + " of the last three comments. Errors cluster at the end of a batch, so that is the part worth reading twice next time.",
      good: tailCatches >= 2 },
    { title: "Used a free AI tool to draft real feedback", step: 7,
      status: usedTool ? "You ran the rebuilt prompt in " + esc(t.tool) + " and reviewed what it actually produced." : "Still open: run the rebuilt prompt in a real tool on real papers before this one is done.",
      good: usedTool }
  ];
}

function openModal(html) { $("#mbox").innerHTML = `<button class="x" onclick="closeModal()" aria-label="Close">×</button>` + html; $("#modal").classList.add("on"); }
function closeModal() { $("#modal").classList.remove("on"); }
function openFiles(w) { openModal(`<div class="refnav"><button class="doctab on" data-w="assignment" onclick="mdoc('assignment')">Assignment</button><button class="doctab" data-w="rubric" onclick="mdoc('rubric')">Rubric</button><button class="doctab" data-w="park" onclick="mdoc('park')">Mr. Park's note</button><button class="doctab" data-w="papers" onclick="mdoc('papers')">The twelve papers</button></div><div id="mpane"></div>`); mdoc(w || "assignment"); }
function mdoc(w) { $("#mpane").innerHTML = w === "papers" ? SAMPLES.map(s => `<div class="sample" style="margin-bottom:.6rem"><div class="pid"><span>${s.id}</span><span class="syn">synthetic</span></div>${esc(s.text)}</div>`).join("") : docHTML(w); document.querySelectorAll("#mbox .doctab").forEach(b => b.classList.toggle("on", b.dataset.w === w)); }
function openRef(w) {
  const tabs = [["rubric", "Lab rubric"], ["crosswalk", "Framework crosswalk"], ["facilitator", "Facilitator note"], ["task", "TASK frame"]].concat(CONFIG.preview ? [["harvest", "Harvest"]] : []);
  openModal(`<div class="refnav">${tabs.map(([k, l]) => `<button class="doctab ${k === w ? "on" : ""}" data-w="${k}" onclick="mref('${k}')">${l}</button>`).join("")}</div><div id="mpane"></div>`); mref(w);
}

async function harvest() {
  const out = $("#harvestOut"); const runs = [];
  for (let r = 0; r < 3; r++) { for (const half of [[0, 6], [6, 12]]) {
    out.textContent = `Pass ${r + 1}, papers ${half[0] + 1} to ${half[1]}...`;
    const txt = SAMPLES.slice(half[0], half[1]).map(s => `${s.id}: ${s.text}`).join("\n\n");
    try { runs.push({ pass: r + 1, papers: half, out: await callModel(SANDBOX_SYSTEM, `${NAIVE_PROMPT.replace("six", "these")}\n\nRUBRIC:\n${rubricText()}\n\nRESPONSES:\n${txt}`) }); } catch (e) { out.textContent = "Live call failed: " + e.message; return; } } }
