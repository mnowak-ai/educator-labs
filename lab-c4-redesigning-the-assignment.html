<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Lab C4: Redesigning the Assignment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A0B47; --purple:#4A1478; --violet:#7B2FBE; --gold:#E9A23B;
  --green:#2E7D4F; --red:#B3261E; --paper:#FFFFFF; --wash:#F6F1FB; --line:#E3D9F0; --muted:#6B5C7C;
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
h1,h2,h3{font-family:var(--serif);color:var(--purple);margin:0 0 .5rem;line-height:1.15;font-weight:600}
h1{font-size:2.4rem} h2{font-size:1.75rem} h3{font-size:1.2rem}
p{margin:0 0 1rem}
.mono{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.lead{font-size:1.1rem}
button{font-family:inherit}
a{color:var(--violet)}
#top{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:10}
#top .in{max-width:1080px;margin:0 auto;padding:.75rem 1.25rem;display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap}
#top .brand{font-family:var(--serif);font-weight:700;color:var(--purple);font-size:1.05rem;white-space:nowrap}
#top .brand span{color:var(--gold)}
#bar{flex:1;height:8px;background:var(--wash);border-radius:99px;min-width:140px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--gold));border-radius:99px;transition:width .4s}
#score{display:flex;gap:.9rem;align-items:center}
.pill{border:1px solid var(--line);border-radius:99px;padding:.2rem .7rem;font-family:var(--mono);font-size:.8rem;color:var(--purple);background:#fff}
.pill b{color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:2rem 1.25rem 5rem}
.screen{display:none;animation:none}
.screen.on{display:block}
.step-label{font-family:var(--mono);font-size:.8rem;color:var(--violet);margin-bottom:.4rem;letter-spacing:.02em}
.budget{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-bottom:1.25rem}
.card{border:1px solid var(--line);border-radius:14px;padding:1.25rem 1.4rem;background:#fff;margin-bottom:1rem}
.card.wash{background:var(--wash);border-color:transparent}
.card.gold{border-color:var(--gold);background:#FFF9EE}
.card.good{border-color:var(--green);background:#EFF7F1}
.card.bad{border-color:var(--red);background:#FCEFEE}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
#rebuild-grid{grid-template-columns:1.1fr .9fr;gap:1.25rem}
@media (max-width:860px){#rebuild-grid{grid-template-columns:1fr} #rebuild-grid>div:last-child{position:static!important}}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:10px;padding:.8rem 1.35rem;font-size:1rem;font-weight:600;cursor:pointer;background:var(--violet);color:#fff;transition:background .15s,transform .05s}
.btn:hover{background:var(--purple)} .btn:active{transform:translateY(1px)}
.btn:disabled{background:#CBBFDA;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--violet);border:1.5px solid var(--violet)}
.btn.ghost:hover{background:var(--wash)}
.btn.sm{padding:.45rem .9rem;font-size:.9rem}
.btn.gold{background:var(--gold);color:var(--ink)} .btn.gold:hover{background:#d8912f}
.btn.copied,.btn.ghost.copied{background:var(--green);color:#fff;border-color:var(--green)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;gap:1rem;flex-wrap:wrap}
.nav .hint{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.assign{font-family:var(--serif);font-size:1.25rem;line-height:1.5;color:var(--ink);padding:1.25rem 1.5rem;border-left:5px solid var(--gold);background:var(--wash);border-radius:0 12px 12px 0;margin:1rem 0 1.5rem}
.speech{position:relative;padding:1.1rem 1.4rem 1.1rem 4.4rem;border:1px solid var(--line);border-radius:14px;margin-bottom:1rem;background:#fff}
.speech .who{position:absolute;left:1rem;top:1rem;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:1.05rem}
.speech .who.gold{background:var(--gold);color:var(--ink)}
.speech .name{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-bottom:.25rem}
.speech p:last-child{margin:0}
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:1rem 1.2rem;background:#fff;cursor:pointer;font-size:1rem;color:var(--ink);transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--violet)}
.choice.sel{border-color:var(--violet);background:var(--wash);box-shadow:inset 0 0 0 1px var(--violet)}
.choice.hit{border-color:var(--green);background:#EFF7F1}
.choice.miss{border-color:var(--red);background:#FCEFEE}
.choice small{display:block;color:var(--muted);margin-top:.3rem;font-size:.92rem}
.paper{font-family:var(--serif);font-size:1.02rem;line-height:1.6;padding:1.1rem 1.25rem;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:9rem}
.tag{display:inline-block;font-family:var(--mono);font-size:.75rem;padding:.15rem .55rem;border-radius:6px;background:var(--wash);color:var(--purple);margin-right:.35rem}
.tag.gold{background:#FFF3DC;color:#8a5a12}
.tag.green{background:#E3F2E8;color:var(--green)}
.tag.red{background:#FBE3E1;color:var(--red)}
.spot{display:inline;padding:.1rem .3rem;border-radius:6px;cursor:pointer;border-bottom:2px dashed var(--violet);transition:background .15s}
.spot:hover{background:var(--wash)}
.spot.sel{background:#FFF3DC;border-bottom-color:var(--gold)}
.spot.hit{background:#E3F2E8;border-bottom-color:var(--green)}
.leak{border:1px solid var(--line);border-radius:12px;padding:.8rem 1.1rem;margin:0 0 1rem;background:#fff}
.leak-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.82rem;color:var(--muted);margin-bottom:.5rem}
.leak-label b{color:var(--purple);font-size:.95rem}
.leak-bar{display:flex;gap:.4rem}
.leak-bar i{flex:1;height:12px;border-radius:99px;background:var(--wash);transition:background .3s}
.leak-bar i.on{background:linear-gradient(90deg,var(--gold),#d8912f)}
.reason{border-left:3px solid var(--gold);padding:.6rem .9rem;background:#FFF9EE;border-radius:0 8px 8px 0;margin:.5rem 0;font-size:.95rem}
.lever{border:1.5px solid var(--line);border-radius:14px;padding:1.1rem 1.25rem;background:#fff;transition:border-color .15s}
.lever.lead{border-color:var(--gold)}
.lever.dim{opacity:.6}
.lever h3{margin-bottom:.15rem}
.lever .why{color:var(--muted);font-size:.92rem;margin-bottom:.7rem}
.lever .badge{font-family:var(--mono);font-size:.72rem;color:#8a5a12;background:#FFF3DC;padding:.15rem .5rem;border-radius:6px;display:inline-block;margin-bottom:.5rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .6rem;border-radius:8px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:var(--wash)}
.opt.sel{background:var(--wash);border-color:var(--violet)}
.opt input{margin-top:.3rem;accent-color:var(--violet)}
.own{width:100%;margin-top:.4rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:.95rem}
textarea{width:100%;font-family:var(--serif);font-size:1.08rem;line-height:1.55;padding:1rem 1.1rem;border:1.5px solid var(--line);border-radius:12px;resize:vertical;color:var(--ink);background:#fff}
textarea:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
input[type=text]{width:100%;padding:.7rem .85rem;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:1rem;color:var(--ink)}
label{display:block;margin-bottom:.35rem}
.sandbox{border:1.5px solid var(--purple);border-radius:14px;overflow:hidden;background:#fff}
.sandbox .head{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;background:var(--purple);color:#fff;font-family:var(--mono);font-size:.8rem}
.sandbox .head i{width:.6rem;height:.6rem;border-radius:50%;background:var(--gold);display:inline-block}
.sandbox .prompt{padding:.9rem 1rem;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.88rem;white-space:pre-wrap;background:var(--wash);color:var(--ink);max-height:14rem;overflow:auto}
.sandbox .out{padding:1rem 1.1rem;min-height:8rem;font-family:var(--serif);font-size:1.02rem;line-height:1.6;white-space:pre-wrap}
.sandbox .out.wait{color:var(--muted);font-family:var(--mono);font-size:.88rem}
.sandbox .foot{padding:.6rem 1rem;border-top:1px solid var(--line);display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.chat{border:1.5px solid var(--purple);border-radius:14px;overflow:hidden;background:#fff}
.chat-head{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;background:var(--purple);color:#fff;font-family:var(--mono);font-size:.8rem}
.chat-head i{width:.6rem;height:.6rem;border-radius:50%;background:var(--gold);display:inline-block}
.chat-log{padding:1rem;min-height:7rem;background:var(--wash);display:flex;flex-direction:column;gap:.75rem}
.chat-log .empty{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.msg{display:flex} .msg.me{justify-content:flex-end}
.msg .b{max-width:82%;padding:.7rem 1rem;border-radius:14px;line-height:1.55;white-space:pre-wrap}
.msg.me .b{background:var(--violet);color:#fff;border-bottom-right-radius:4px;font-family:var(--sans)}
.msg.ai .b{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;font-family:var(--serif);font-size:1.02rem}
.chat-in{display:flex;gap:.6rem;padding:.75rem 1rem;align-items:flex-end;border-top:1px solid var(--line)}
.chat-in textarea{font-family:var(--sans);font-size:1rem;border-radius:10px;flex:1;margin:0}
.timer{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.starters .s{margin-bottom:1.1rem}
.starters .s .lead-in{font-family:var(--serif);color:var(--purple);font-size:1.1rem;margin-bottom:.3rem}
.counter{font-family:var(--mono);font-size:.76rem;color:var(--muted);text-align:right;margin-top:.2rem}
.warn{color:var(--red);font-size:.9rem;margin-top:.3rem}
.skill{border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.25rem;background:#fff}
.skill .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.4rem}
.skill .medal{width:2.4rem;height:2.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;background:var(--wash);color:var(--muted);flex:none}
.skill.earned .medal{background:var(--gold);color:var(--ink)}
.skill.earned{border-color:var(--gold)}
.retry-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.tool{border:1.5px solid var(--line);border-radius:12px;padding:.9rem;text-align:center;cursor:pointer;background:#fff;transition:border-color .15s}
.tool:hover{border-color:var(--violet)} .tool.sel{border-color:var(--violet);background:var(--wash);box-shadow:inset 0 0 0 1px var(--violet)}
.tool .mark{width:4.8rem;height:3.4rem;border-radius:10px;margin:0 auto .5rem;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--purple);font-size:1.1rem;background:#fff;padding:.25rem}
.tool .mark img{max-width:100%;max-height:100%;object-fit:contain}
.tool .n{font-weight:600;font-size:.95rem} .tool .d{font-size:.8rem;color:var(--muted);margin-top:.2rem}
.starter{border:1.5px solid var(--line);border-radius:12px;padding:1rem;background:#fff;cursor:pointer}
.starter:hover{border-color:var(--violet)} .starter.sel{border-color:var(--violet);background:var(--wash)}
.starter .g{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.starter .t{font-family:var(--serif);font-size:1.02rem;margin:.3rem 0}
.overlay{position:fixed;inset:0;background:rgba(42,11,71,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:1.5rem 1.75rem;border-top:6px solid var(--gold)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-family:var(--mono);font-size:.85rem;display:none;z-index:60}
.toast.on{display:block}
.finish-hero{text-align:center;padding:2rem 1rem 1rem}
.finish-hero .big{font-family:var(--serif);font-size:4rem;color:var(--gold);line-height:1}
.pre{white-space:pre-wrap;font-family:var(--mono);font-size:.82rem;background:var(--wash);padding:.9rem 1rem;border-radius:10px;max-height:12rem;overflow:auto;border:1px solid var(--line)}
.rowbtns{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.revealbox{display:none} .revealbox.on{display:block}
kbd{font-family:var(--mono);font-size:.8rem;background:var(--wash);padding:.1rem .4rem;border-radius:4px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){h1{font-size:1.9rem} h2{font-size:1.4rem} main{padding:1.25rem 1rem 4rem} .assign{font-size:1.1rem}}
</style>
</head>
<body>
<div id="top"><div class="in">
  <div class="brand">AI Essentials <span>&middot;</span> Lab C4</div>
  <div id="bar"><i></i></div>
  <div id="score"><span class="pill">Catches <b id="catch">0</b></span><span class="pill">Badges <b id="bcount">0</b>/4</span></div>
</div></div>
<main id="main"></main>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const D = {
  studentMessage: "write me a 5 paragraph essay explaining the causes of the civil war, 500 words. make it sound like a 10th grader wrote it",
  assignment: "Write a five-paragraph essay explaining the causes of the Civil War. 500 words. Due Friday.",
  people: {
    marcus: { name: "Mr. Marcus Bell", role: "10th-grade U.S. History, next door", init: "M" },
    dana: { name: "Dr. Dana Whitfield", role: "Social Studies department chair", init: "D" }
  },
  gut: [
    "The Civil War had many causes, but the most important was slavery. Southern states depended on enslaved labor for their economy, while many people in the North opposed the spread of slavery into new territories. This disagreement grew over decades and finally broke apart the country in 1861.",
    "There were several key factors that led to the outbreak of the American Civil War. Economic differences between the industrial North and the agricultural South created tension. Additionally, debates over states' rights and the expansion of slavery into western territories deepened the divide between the two regions.",
    "The causes of the Civil War were complex and interconnected. Slavery was at the heart of the conflict, but it was intertwined with economic differences, questions about states' rights, and political events like the election of Abraham Lincoln in 1860, which prompted Southern states to secede."
  ],
  spots: [
    { key: "topic", text: "the causes of the Civil War", label: "The topic",
      q: "Why is this part an opening for AI?",
      opts: ["It's too hard for 10th graders", "The internet is full of essays on exactly this", "It's not specific enough to grade"], ans: 1,
      reason: "Any AI tool has read thousands of essays on this exact topic. It's one of the most common school assignments on the internet." },
    { key: "product", text: "five-paragraph essay", label: "What they hand in",
      q: "What's the problem with asking for this?",
      opts: ["Students hate writing essays", "It's the one format AI writes best", "Five paragraphs is too short"], ans: 1,
      reason: "The five-paragraph essay is the single format AI writes best. It was practically trained on it." },
    { key: "source", text: "500 words", label: "Where the evidence comes from",
      q: "Look at the whole assignment. Where does the evidence have to come from?",
      opts: ["The textbook", "Class notes and handouts", "Nowhere in particular"], ans: 2,
      reason: "Nothing says where the evidence has to come from. No class discussion, no handout, no source the AI can't reach. So the AI uses whatever it already knows." },
    { key: "timeline", text: "Due Friday.", label: "The timeline",
      q: "What happens between now and Friday?",
      opts: ["Nothing. One deadline, no check-in", "A draft is due Wednesday", "Students work in class"], ans: 0,
      reason: "One deadline, nothing in between. No draft, no check-in, no moment where a student has to show their thinking in the room." }
  ],
  leak: ["Sealed", "One drip", "Leaking", "Pouring", "Wide open"],
  lanes: {
    useless: { title: "Make AI useless here", line: "Change the assignment so an AI tool can't do the real work, even if a student tries." },
    productive: { title: "Make AI part of the work", line: "Let students use AI, but build the assignment so using it well is the actual learning." }
  },
  levers: [
    { key: "anchor", title: "Tie it to something the AI can't see", why: "AI only knows what's on the internet. Your classroom isn't.",
      titleP: "Give students something real to check the AI against", whyP: "If students have a source the AI doesn't, they can catch when it makes things up.",
      opts: [
        { id: "debate", text: "Use two arguments from Tuesday's class debate", line: "Use at least two arguments you heard in Tuesday's class debate, and name who made them." },
        { id: "packet", text: "Quote from the primary source packet I handed out", line: "Quote directly from two documents in the primary source packet from class. Use the document numbers." },
        { id: "family", text: "Connect it to your own family, town, or community", line: "Connect one cause to something in your own town, family, or community, and explain the link." }
      ] },
    { key: "product", title: "Change what students hand in", why: "AI is great at essays. It's worse at almost everything else.",
      opts: [
        { id: "letter", text: "A letter to a real person from 1860", line: "Instead of an essay, write a one-page letter to a real person living in 1860, explaining what you think is about to happen and why." },
        { id: "recording", text: "A 90-second recorded argument", line: "Record a 90-second video or audio clip arguing which cause mattered most. No script on screen." },
        { id: "map", text: "An annotated map with a caption", line: "Make an annotated map showing where three causes played out, with a caption for each." }
      ] },
    { key: "live", title: "Add a live piece", why: "Something that happens in the room, with a person, can't be pasted.",
      opts: [
        { id: "defense", text: "A two-minute stand-up defense", line: "Be ready to defend your main point out loud for two minutes. I will call on a few students at random." },
        { id: "interview", text: "A peer interview", line: "Interview a classmate about their strongest cause and include one thing they said that changed your mind." },
        { id: "draft", text: "An in-class first draft", line: "Write your first draft in class on Wednesday. Your final must build on that draft." }
      ] },
    { key: "aiobj", title: "Make the AI the thing they work on", why: "Instead of banning it, hand students an AI essay and make them take it apart.",
      opts: [
        { id: "factcheck", text: "Fact-check an AI-written essay", line: "I will give you an AI-written essay on this topic. Find at least two claims that are wrong or unsupported and fix them with real evidence." },
        { id: "weak", text: "Find the weakest argument in an AI essay", line: "Read the AI-written essay I give you. Pick its weakest argument and explain why it doesn't hold up." },
        { id: "improve", text: "Improve an AI essay and mark what changed", line: "Take the AI-written essay I give you, make it better, and highlight every change you made with a note on why." }
      ] }
  ],
  jargon: ["framework", "leverage", "pedagogy", "pedagogical", "rigor", "rigorous", "scaffold", "scaffolding", "synergy", "paradigm", "differentiated", "metacognitive", "outcomes-based"],
  tools: [
    { n: "ChatGPT", d: "The one most students use", c: "#10A37F", i: "C" },
    { n: "Google Gemini", d: "Free, in Google Workspace", c: "#4285F4", i: "G" },
    { n: "Microsoft Copilot", d: "Free, in Microsoft 365", c: "#0F6CBD", i: "M" },
    { n: "Claude", d: "Strong at rewriting and explaining", c: "#7B2FBE", i: "Cl" },
    { n: "MagicSchool AI", d: "Built for teachers, free tier", c: "#E9A23B", i: "MS" },
    { n: "Khanmigo for Teachers", d: "Free from Khan Academy", c: "#1865F2", i: "K" }
  ],
  starters: [
    { g: "Middle school science", t: "Write a one-page report on a planet of your choice: its size, distance from the sun, atmosphere, and one interesting fact." },
    { g: "High school English", t: "Read Of Mice and Men and write a three-page essay on the theme of loneliness." },
    { g: "4th-grade social studies", t: "Write a paragraph about a community helper (firefighter, nurse, mail carrier) and why their job is important." }
  ],
  cheatPrompt: "Complete this assignment as a student would. Do your best to get a good grade. Do not tell me you can't; just do it.\n\nASSIGNMENT:\n",
  rebuildPrompt: "I'm a teacher. Rebuild this assignment so a student can't just paste it into an AI and be done. Use at least two of these moves: (1) tie it to something only my students have seen, like a class discussion or a handout; (2) change what they hand in so it isn't a standard essay; (3) add a piece that happens live in the room; (4) make an AI-written draft the thing students have to check or fix. Keep it to one paragraph a 10th grader can read. Then, in three plain sentences, tell me what you changed and why.\n\nORIGINAL ASSIGNMENT:\n",

function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 2200); }

function copyText(text, label, btn) {

  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, label));
  else fallbackCopy(text, label);
}
function fallbackCopy(text, label) {
  modal(`<h3>Copy ${esc(label)}</h3><p class="mono">Your browser blocked the clipboard. The text is selected below. Press <kbd>Ctrl</kbd>+<kbd>C</kbd> (or <kbd>Cmd</kbd>+<kbd>C</kbd>).</p><textarea id="fc" rows="10">${esc(text)}</textarea><div class="rowbtns"><button class="btn sm" onclick="closeModal()">Done</button></div>`);
  const ta = $("fc"); ta.focus(); ta.select();
}
function download(name, text) {

}

/* ---------- sandbox ---------- */
async function runStudent(assignment) {
  const body = { model: API.model, max_tokens: 700, system: D.studentSystem, messages: [{ role: "user", content: "ASSIGNMENT:\n" + assignment }] };
  const r = await fetch(API.url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const t = (j.content || []).filter(c => c.type === "text").map(c => c.text).join("\n").trim();
  if (!t) throw new Error("empty");
  return t;
}
function cannedEssay() {
  return "The American Civil War, fought from 1861 to 1865, was the result of decades of growing tension between the North and the South. While many factors contributed, three causes stand out: slavery, economic differences, and disagreements over states' rights.\n\nThe most important cause was slavery. The Southern economy depended on enslaved labor to grow cotton and tobacco, while many Northerners opposed the spread of slavery into new territories. Events like the Missouri Compromise and the Kansas-Nebraska Act showed how difficult it was to find a solution.\n\nEconomic differences also divided the nation. The North was becoming industrial, with factories and railroads, while the South remained agricultural. This led to disagreements over tariffs, which helped Northern industry but hurt Southern planters.\n\nFinally, the two regions disagreed about states' rights. Southern leaders argued that states could ignore federal laws they disliked, and even leave the Union. When Abraham Lincoln was elected in 1860, Southern states began to secede.\n\nIn conclusion, the Civil War was caused by slavery, economic differences, and states' rights. These issues had built up for years, and by 1861 the country could no longer hold together.";
}
function cannedRedesign() {
  const L = S.levers, o = S.own;
  let p = [];
  if (L.anchor === "packet" || L.anchor === "own" && /packet|handout|document/i.test(o.anchor)) p.push("As Document 3 in our class packet states, \"The Union cannot survive half slave and half free\" (Document 3). This shows that even in 1858 leaders saw the split coming. Document 7 adds that Southern planters \"would sooner leave than yield\" (Document 7), which points to how deep the economic divide had become.");
  else if (L.anchor === "debate") p.push("In Tuesday's class debate, Maria argued that slavery was the root of every other cause, and Jordan countered that tariffs pushed the South to the breaking point. Both arguments show how economic and moral issues were tangled together.");
  else if (L.anchor === "family") p.push("In my own town, an old factory building downtown shows how the North was becoming industrial while the South stayed agricultural. This same divide was one of the main causes of the war.");
  else if (L.anchor === "own") p.push("Based on what we discussed in class, the strongest cause was slavery, which shaped the economy and politics of the South.");
  if (L.aiobj) p.push("The AI-written essay I was given claims that the war began in 1860 and that tariffs were the main cause. Both are wrong: the war began in April 1861, and historians agree slavery was central. I have corrected these below.");
  if (L.product === "letter") p.unshift("Dear Mr. Douglass,\n\nI am writing to you in the fall of 1860 because I fear our country is about to break apart.");
  else if (L.product === "recording") p.unshift("[Script for 90-second recording]\n\nThe cause that mattered most was slavery, and here is why.");
  else if (L.product === "map") p.unshift("[Annotated map captions]\n\n1. Kansas: where settlers fought over whether slavery would spread west.");
  if (!p.length) p.push(cannedEssay().split("\n\n").slice(0, 3).join("\n\n"));
  return p.join("\n\n");
}
function fabricatedBits(text) {

  const T = S.transfer; const chosen = T.mode === "own" ? T.own.trim() : T.starter != null ? D.starters[T.starter].t : "";
  const ready = chosen.length > 20 && T.tool != null && T.changed.trim().split(/\s+/).filter(Boolean).length >= 5;
  $("next").disabled = !ready; $("gate-hint").textContent = ready ? "" : "Assignment, tool, and one line to finish";
}

R[10] = () => {
  const B = badges(), e = B.filter(b => b.earned).length;
  return shell(`
  <div class="finish-hero"><div class="big">${e}<span style="font-size:1.6rem;color:var(--muted)"> of 4</span></div><div class="mono" style="margin:.2rem 0 1rem">badges earned</div><h1 style="font-size:2rem">Lab complete</h1><p class="lead">You cheat-tested an assignment, found where it leaked, rebuilt it, tested it again, and wrote a note a colleague can use. Then you did it once more with a real tool.</p></div>
  <div class="grid g2">${B.map(b => `<div class="skill ${b.earned ? "earned" : ""}"><div class="top"><h3 style="margin:0">${esc(b.name)}</h3><div class="medal">${b.earned ? "&#10003;" : "&middot;"}</div></div><p class="mono" style="margin:0">${b.earned ? "Earned" : "Not earned yet"}</p></div>`).join("")}</div>
  <div style="margin-top:1.25rem">${retryBlock(B, "Want a perfect score?")}</div>
  <div class="card gold" style="margin-top:1.25rem"><h3>Take it with you</h3><p>One page: the original assignment, your redesign, your note to Dana, your badges, and what you did in your own tool. Share it with a mentor, a supervisor, or a department chair.</p>
    <div class="rowbtns"><button class="btn gold" onclick="makePdf()">Download your lab summary (PDF)</button><button class="btn ghost" onclick="copyText(summaryText(),'Summary',this)">Copy as text</button></div></div>
  <p class="mono" style="margin-top:1.5rem">Want the other lane? <a href="#" onclick="event.preventDefault();S.lane=null;S.levers={anchor:null,product:null,live:null,aiobj:null};S.redesignTouched=false;S.s6={ran:false,out:'',notice:null,trimmed:false,verdict:null,live:null};S.note=['','',''];go(4)">Go back to Pick your lane</a> and run it the other way.</p>
`, { noNav: true });
};

/* ---------- re-earn a badge ---------- */
const RETRY = {
  cheat: { label: "Run the sandbox you skipped", tip: "Both Try it yourself and the Stress test need a run." },
  spot: { label: "Redo the weak-spot hunt", tip: "All four parts, with no more than one wrong guess." },
  anchor: { label: "Rebuild with the first card, then test again", tip: "Pick a move from the top card on the left, run the stress test, and name what the AI made up." },
  talk: { label: "Rewrite your note to Dana", tip: "Six to forty-five words each, and no education words." }
};
function retry(key) { S.fromFinish = true;
  if (key === "cheat") { go(!S.s2.ran ? 2 : 6); return; }
  if (key === "spot") { S.spots = []; S.spotsChecked = false; S.spotOpen = null; Object.values(S.spotState).forEach(s => { s.done = false; s.tried = []; }); go(3); return; }
  if (key === "anchor") { S.s6 = { ran: false, out: "", notice: null, trimmed: S.s6.trimmed, verdict: null, live: null }; go(5); return; }
  if (key === "talk") { go(7); }
}
function retryBlock(B, heading) {
  const missed = B.filter(b => !b.earned); if (!missed.length) return `<div class="card good"><h3>Perfect score. All four badges.</h3><p style="margin:0">Nothing left to re-earn here. Save the PDF and take it to a colleague.</p></div>`;
  return `<div class="card wash"><h3>${esc(heading)}</h3><p>You can go back and re-earn any badge. Your work so far stays put, and the badge updates as soon as you've done it.</p>
    ${missed.map(b => `<div class="retry-row"><div><b>${esc(b.name)}</b><div class="mono">${esc(RETRY[b.key].tip)}</div></div><button class="btn sm" onclick="retry('${b.key}')">${esc(RETRY[b.key].label)}</button></div>`).join("")}</div>`;
}

/* ---------- summary + pdf ---------- */
function laneName() { return S.lane ? D.lanes[S.lane].title : ""; }
function noteLines() { const P = S.lane === "productive"; const st = ["The old assignment was easy to hand off because", "I changed", P ? "A student who uses AI on this now has to" : "A student can't just paste it now because"]; return st.map((s, i) => s + " " + S.note[i].trim()); }
function summaryText() {
  const T = S.transfer; const chosen = T.mode === "own" ? T.own.trim() : T.starter != null ? D.starters[T.starter].t : "";
  const tool = T.tool != null ? D.tools[T.tool].n : "";
  return `AI Essentials, AI Powered Educators, Lab C4: Redesigning the Assignment\nCompleted ${new Date().toLocaleDateString()}\n\nRole: 10th-grade U.S. History teacher, asked by the department chair to fix a colleague's assignment.\nLane: ${laneName()}\n\nBEFORE\n${D.assignment}\n\nAFTER\n${S.redesign.trim()}\n\nNOTE TO THE DEPARTMENT CHAIR\n${noteLines().join("\n")}\n\nBADGES\n${badges().map(b => (b.earned ? "[x] " : "[ ] ") + b.name).join("\n")}\n\nDONE IN A REAL TOOL\nTool: ${tool}\nAssignment: ${chosen}\nWhat changed: ${T.changed.trim()}`;
}
function pdfText(t) { return String(t).replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/\u2013|\u2014/g, "-").replace(/\u2026/g, "...").replace(/\u2713/g, "[x]").replace(/[^\x20-\x7E\n]/g, "").replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)"); }
const HW = { "i": .28, "l": .22, "j": .22, "t": .28, "f": .28, "r": .33, " ": .28, ".": .28, ",": .28, "m": .83, "w": .72, "M": .83, "W": .94, "I": .28 };
function tw(s, size) { let w = 0; for (const ch of s) w += (HW[ch] ?? (ch >= "A" && ch <= "Z" ? .68 : .53)) * size; return w; }
function wrap(text, size, width) { const out = []; text.split("\n").forEach(par => { let line = ""; par.split(" ").forEach(word => { const t = line ? line + " " + word : word; if (tw(t, size) > width && line) { out.push(line); line = word; } else line = t; }); out.push(line); }); return out; }
function makePdf() {
  const W = 612, Hh = 792, M = 54, w = W - M * 2; const pages = []; let ops = [], y = M;
  const col = (r, g, b) => `${(r / 255).toFixed(3)} ${(g / 255).toFixed(3)} ${(b / 255).toFixed(3)} rg`;
  const purple = col(74, 20, 120), ink = col(42, 11, 71), gold = col(233, 162, 59), mute = col(107, 92, 124);
  const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = M; ops.push(`${gold} 0 ${Hh - 6} ${W} 6 re f`); };
  const need = h => { if (y + h > Hh - 60) newPage(); };
  const txt = (s, size, font, color, x) => { ops.push(`BT /${font} ${size} Tf ${color} ${x} ${(Hh - y).toFixed(1)} Td (${pdfText(s)}) Tj ET`); };
  const H = (t, size = 13) => { need(size + 16); y += 6; txt(t, size, "F2", purple, M); y += size + 6; };
  const P = (t, size = 10.5, color = ink, x = M, width = w) => { wrap(t, size, width).forEach(l => { need(size + 4); txt(l, size, "F1", color, x); y += size + 4; }); y += 5; };
  newPage();
  txt("AI ESSENTIALS  |  AI POWERED EDUCATORS  |  LAB C4  |  ASSESSMENT", 8.5, "F2", mute, M); y += 22;
  txt("Redesigning the Assignment", 22, "F2", purple, M); y += 22;
  P("Lab summary, completed " + new Date().toLocaleDateString() + ". Role: 10th-grade U.S. History teacher asked by the department chair to fix a colleague's assignment before he runs it again. Lane chosen: " + laneName() + ".", 10, mute);
  H("Before"); P(D.assignment);
  H("After"); P(S.redesign.trim());
  H("Note to the department chair"); noteLines().forEach(l => P(l));
  H("Badges earned");
  badges().forEach(b => { need(30); txt((b.earned ? "[x]  " : "[ ]  ") + b.name, 10.5, "F2", b.earned ? purple : mute, M); y += 14; P(b.what, 10, ink, M + 18, w - 18); });
  const T = S.transfer; const chosen = T.mode === "own" ? T.own.trim() : T.starter != null ? D.starters[T.starter].t : "";
  H("Done again in a real tool");
  P("Tool: " + (T.tool != null ? D.tools[T.tool].n : ""));
  P("Assignment: " + chosen);
  P("What changed: " + T.changed.trim());
  pages.push(ops);
  // assemble
  const objs = []; const add = s => { objs.push(s); return objs.length; };
  const f1 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  const f2 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  const pagesId = objs.length + 1 + pages.length * 2;
  const kids = [];
  pages.forEach((p, i) => {
    const foot = `BT /F1 8.5 Tf ${mute} ${M} 34 Td (${pdfText("Practice work in a sandbox. Nothing here was sent to a real colleague. essentials-ai.com   Page " + (i + 1) + " of " + pages.length)}) Tj ET`;
    const stream = p.join("\n") + "\n" + foot;
    const c = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    const pg = add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${Hh}] /Contents ${c} 0 R /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> >>`);
    kids.push(pg + " 0 R");
  });
  add(`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${pages.length} >>`);
  const cat = add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
  let out = "%PDF-1.4\n"; const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("") + `trailer\n<< /Size ${objs.length + 1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const blob = new Blob([out], { type: "application/pdf" }); const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "lab-c4-redesigning-the-assignment-summary.pdf"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => { const wnd = window.open(url, "_blank"); if (!wnd) toast("If nothing downloaded, allow pop-ups or use Copy as text"); }, 400);
}

/* ---------- nav ---------- */
function go(i) { if (i < 0 || i >= STEPS.length) return; S.step = i; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function render() { main.innerHTML = R[S.step](); updateTop(); }
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeModal(); });
window.__lab = { S, go, badges };
render();

</script>
